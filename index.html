<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VK – Your agent-ready product ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400&family=Work+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="nav">
      <a href="/" class="nav__logo" aria-label="VK home">
        <img src="/vk-logo.webp" alt="VK" width="2000" height="990" />
      </a>
      <nav class="nav__links" aria-label="Main">
        <a href="#">Work</a>
        <a href="#">About</a>
        <a href="#">Our Thinking</a>
      </nav>
      <a href="#" class="btn btn--primary btn--small">Lets Talk</a>
    </header>

    <main>
      <section class="hero container">
        <h1 class="hero__title">
          <span class="hero__title-setup">Your agent-ready product ecosystem,</span>
          designed by people.<span class="hero__chip" aria-hidden="true">
            <img src="/images/team/portrait-1.webp" alt="" width="50" height="50" />
            <img src="/images/team/portrait-2.webp" alt="" width="50" height="50" />
            <img src="/images/team/portrait-3.webp" alt="" width="50" height="50" />
          </span>
        </h1>
        <div class="hero__actions">
          <a href="#" class="btn btn--primary">Lets Talk</a>
          <a href="#" class="btn btn--outline">See Our Full Work</a>
        </div>
      </section>

      <section class="mosaic container" aria-label="Selected work">
        <div class="mosaic__grid">
          <a href="#" class="tile tile--characters">
            <img
              src="/images/work/pixel-characters.png"
              alt="Four pixel-art characters with eyes: a heart, a star, a pushpin and a rounded blob"
              width="1098"
              height="1062"
            />
          </a>
          <a href="#" class="tile tile--harvester">
            <img
              src="/images/work/harvester-alert.webp"
              alt="Vehicle alert card over a satellite map, warning of low rear tire pressure on a harvester"
              width="1028"
              height="508"
            />
          </a>
          <a href="#" class="tile tile--pattern">
            <img
              src="/images/work/pixel-pattern.webp"
              alt="Pixel pattern of keys with arrow symbols and a diagonal run of orange and pink keys"
              width="508"
              height="508"
            />
          </a>
          <a href="#" class="tile tile--simulation">
            <img
              src="/images/work/team-simulation.png"
              alt="Team simulation screen listing required skills beside a radar chart on a dark background"
              width="1568"
              height="508"
            />
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
